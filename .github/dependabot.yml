# Dependabot for tesserix/base-docker-images.
#
# The image Dockerfiles are deliberately absent. Every base now builds
# `FROM ${BASE_IMAGE}`, and Dependabot's Docker parser does not expand ARG in a
# FROM line (dependabot-core#10190) — it would report the images as no longer
# dependencies and close its own PRs. That job moved to upstream-drift.yml,
# which resolves each image's tracked line from images/*/base-source.json and
# raises the same daily bump PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
