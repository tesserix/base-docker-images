name: Weekly base-image rebuild
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Rebuilds every tesserix base image every Saturday at 03:00 UTC, which
# is after Alpine + Debian + the language distros have typically pushed
# their weekend patch releases. We re-pull upstream images with
# `docker build --pull` so a month-stale apk cache doesn't mask a CVE
# that was already fixed upstream.
#
# Runs that don't pass Trivy CRITICAL+HIGH are NOT published — we'd
# rather let the old image keep serving traffic than push a known-bad
# image and have every downstream consumer roll to it.

on:
  schedule:
    - cron: "0 3 * * 6"    # every Saturday, 03:00 UTC
  workflow_dispatch:        # manual fire-now button
    inputs:
      images:
        description: 'Comma-separated subset, or "all"'
        default: "all"
        required: false
      push:
        description: 'Push to GHCR (false for a dry run)'
        type: boolean
        default: true
        required: false
  push:
    branches: [main]
    paths:
      - "images/**"
      - ".github/workflows/weekly-rebuild.yml"
  # Validates the resolver on a PR without spending Actions minutes on eleven
  # image builds; the build jobs below opt out of this trigger.
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write      # push to ghcr.io
  id-token: write      # cosign keyless signing via OIDC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # weekly runs should NOT cancel each other

jobs:
  resolver-tests:
    name: Resolver unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python -m pytest tools -q

  build-matrix:
    name: Build & scan ${{ matrix.image }}
    needs: resolver-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - go-builder
          - alpine-runtime
          - node-builder-22
          - node-runtime-22
          - node-builder-24
          - node-runtime-24
          - nginx-spa
          - python-runtime-3.13
          - python-runtime-3.14
          - debian-runtime
          - distroless-static
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-base-image
        with:
          image: ${{ matrix.image }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          gh-token: ${{ secrets.ADK_READ_TOKEN }}

  # Images built on top of our own bases, so they must run after the job that
  # publishes those bases — otherwise they would inherit last week's runtime.
  build-derived:
    name: Build & scan ${{ matrix.image }}
    needs: build-matrix
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - python-adk-3.13
          - python-adk-3.14
    steps:
      - uses: actions/checkout@v7

      # The ADK is private and not on PyPI, so the wheel comes from its release
      # assets. Verification fails closed and happens before the build: an
      # unattested wheel is the one thing this base must never hand an agent.
      - name: Fetch and verify the latest ADK wheel
        if: startsWith(matrix.image, 'python-adk-')
        env:
          GH_TOKEN: ${{ secrets.ADK_READ_TOKEN }}
          ADK_REPO: tesserix/agent-development-kit
        run: |
          set -euo pipefail
          tag=$(python3 tools/resolve_base.py --build-args "${{ matrix.image }}" --no-digest \
                  | sed -n 's/^ADK_VERSION=//p')
          dest="images/${{ matrix.image }}/wheels"
          gh release download "$tag" --repo "$ADK_REPO" --pattern '*.whl' --dir "$dest" --clobber
          wheel=$(ls "$dest"/*.whl)
          digest=$(sha256sum "$wheel" | cut -d' ' -f1)
          # Verified against the bundle attached to the release, not the
          # attestations API, which needs a separate PAT permission. The bundle
          # is signed by the ADK's release workflow identity, so an attacker
          # swapping it in still cannot forge a passing signature.
          gh release download "$tag" --repo "$ADK_REPO" \
            --pattern "sha256.$digest.jsonl" --dir "$RUNNER_TEMP" --clobber
          gh attestation verify "$wheel" --bundle "$RUNNER_TEMP/sha256.$digest.jsonl" \
            --repo "$ADK_REPO" \
            --signer-workflow "$ADK_REPO/.github/workflows/release.yml"

      - uses: ./.github/actions/build-base-image
        with:
          image: ${{ matrix.image }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          gh-token: ${{ secrets.ADK_READ_TOKEN }}

  # Fires when the Trivy gate in any matrix leg came back red. The gate
  # already fails that matrix leg on its own (exit-code: "1") and the
  # image is NOT published — this job is the fan-out to the security
  # distribution list so a red weekly run surfaces immediately rather
  # than waiting for someone to notice the following Monday.
  notify-security-failure:
    name: Notify — base-image security gate failed
    needs: [resolver-tests, build-matrix, build-derived]
    if: ${{ always() && (needs.resolver-tests.result == 'failure' || needs.build-matrix.result == 'failure' || needs.build-derived.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Send email alert
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[SECURITY] tesserix base-images — weekly rebuild failed"
          from: "Tesserix Security <${{ secrets.SMTP_USERNAME }}>"
          to: samyak.rout@gmail.com, mahesh.sangawar@gmail.com, unidevidp@gmail.com
          body: |
            The weekly base-image rebuild failed a gate — either the upstream
            version resolver or Trivy CRITICAL+HIGH. No image was published;
            downstream consumers keep serving the previous weekly tag.

            Workflow : ${{ github.workflow }}
            Run      : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Trigger  : ${{ github.event_name }}
            Branch   : ${{ github.ref_name }}
            Commit   : ${{ github.sha }}

            Open the failing job in the run above. For a Trivy failure, patch
            the base Dockerfile or add a documented waiver to .trivyignore. For
            a resolver failure, the upstream tag pattern in
            images/<image>/base-source.json no longer matches anything.

  # Optional: fan-out a rebuild event to downstream consumer repos so
  # their Dockerfiles re-pull the fresh base without waiting for a
  # manual push. Opt-in via the `consumers` list below.
  notify-consumers:
    name: Notify consumer repos to rebuild
    needs: [build-matrix, build-derived]
    if: github.event_name == 'schedule' && success()
    runs-on: ubuntu-latest
    steps:
      - name: Trigger downstream weekly rebuild
        env:
          GH_TOKEN: ${{ secrets.TESSERIX_K8S_BOT }}
        run: |
          set -e
          # Add repositories here as they adopt the base images. Each
          # consumer needs a matching workflow with
          # `on: repository_dispatch: types: [base-image-refresh]`.
          consumers=(
            "tesserix/FanZone-Battle-Ground"
            "tesserix/mark8ly"
            "tesserix/Home-Chef-App"
            "tesserix/helivanta"
          )
          for repo in "${consumers[@]}"; do
            echo "::notice::dispatching base-image-refresh to $repo"
            gh api -X POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$repo/dispatches" \
              -f event_type=base-image-refresh \
              || echo "::warning::$repo has not opted-in yet"
          done
